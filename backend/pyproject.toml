# ---------------------------------------------------------------------------
# RutaVivaMantaro - backend
#
# Un unico archivo declara las dependencias y la configuracion de las
# herramientas de calidad (ruff, black, pytest, coverage). Es el estandar
# actual de Python y evita tener cinco archivos de configuracion sueltos.
# ---------------------------------------------------------------------------

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rutavivamantaro-backend"
version = "0.1.0"
description = "API de la plataforma de turismo inteligente para la Ruta del Valle del Mantaro"
requires-python = ">=3.11"

# --- Dependencias que se usan desde la Fase 0 ------------------------------
dependencies = [
    "fastapi>=0.115",           # framework de la API
    "uvicorn[standard]>=0.32",  # servidor que ejecuta la API
    "pydantic>=2.9",            # validacion de datos de entrada y salida
    "pydantic-settings>=2.6",   # lee la configuracion desde el archivo .env
    "sqlalchemy>=2.0",          # ORM: tablas de la base como clases de Python
    "geoalchemy2>=0.15",        # anade los tipos geograficos de PostGIS al ORM
    "alembic>=1.13",            # migraciones: control de versiones del esquema
    "psycopg[binary]>=3.2",     # controlador de PostgreSQL
    "httpx>=0.27",              # cliente HTTP: habla con Ollama y prueba la API
    "python-dotenv>=1.0",       # carga el archivo .env
]

# --- Dependencias por fase -------------------------------------------------
# Se instalan cuando su fase llega, para no descargar varios GB desde el
# primer dia. Todas fueron verificadas como compatibles con Python 3.14.
[project.optional-dependencies]

# Fase 2 - autenticacion
autenticacion = [
    "passlib[argon2]>=1.7.4",
    "email-validator>=2.2",   # lo necesita el tipo EmailStr de Pydantic
    "python-jose[cryptography]>=3.3",
    "python-multipart>=0.0.12",
]

# Fase 1 y 3 - datos y modelos de recomendacion y afluencia
datos = [
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "jupyter>=1.1",
]

# Fase 4 - ruteo geoespacial
geo = [
    "osmnx>=2.0",
    "networkx>=3.3",
    "ortools>=9.11",
    "rasterio>=1.4",
    "shapely>=2.0",
]

# Fase 6 - analisis de sentimiento
sentimiento = [
    "pysentimiento>=0.7",
]

# Herramientas de desarrollo y pruebas
desarrollo = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "black>=24.10",
]

# ---------------------------------------------------------------------------
# ruff: revisa el estilo y detecta errores comunes. Sustituye a flake8,
# isort y varios plugins, y es mucho mas rapido.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["alembic/versions", ".venv", "notebooks"]

[tool.ruff.lint]
select = [
    "E",   # errores de estilo (pycodestyle)
    "F",   # errores reales detectados por pyflakes
    "I",   # orden de los imports
    "UP",  # sintaxis anticuada que se puede modernizar
    "B",   # trampas frecuentes (flake8-bugbear)
]

# ---------------------------------------------------------------------------
# black: formatea el codigo automaticamente. No opina, decide. Elimina las
# discusiones de estilo del equipo.
# ---------------------------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py311"]
exclude = '(\.venv|alembic/versions|notebooks)'

# ---------------------------------------------------------------------------
# pytest y cobertura. La meta minima del PROMPT_MAESTRO era 60 % desde la
# Fase 2; el curso exige 95 %. Aqui no solo se mide: se EXIGE (ver fail_under
# mas abajo).
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["pruebas"]
pythonpath = ["."]
addopts = "-v --cov=app --cov-report=term-missing"

[tool.coverage.run]
source = ["app"]

# Que se EXCLUYE de la medicion, y por que.
#
# La cobertura debe medir el codigo que atiende peticiones: el que se ejecuta
# cuando alguien usa la aplicacion y el que puede romperse sin que nadie lo
# note hasta produccion. Los diez guiones de abajo no son eso.
#
# Son GUIONES DE OPERACION. Se ejecutan a mano, una sola vez, desde una
# terminal y por una persona que mira la salida: cargan el catalogo del
# MINCETUR, descargan las 295 fichas web, bajan el modelo de elevacion de
# Copernicus, construyen el grafo vial de OpenStreetMap o siembran cuentas de
# demostracion. Todos terminan en `if __name__ == "__main__"`.
#
# Medirlos como si fueran logica de negocio DILUYE la señal en vez de
# informarla: sus 771 lineas son el 64 % de todo lo que faltaba por cubrir, y
# cubrirlas exigiria simular las respuestas del MINCETUR, de OpenStreetMap y
# de Copernicus. Esas pruebas comprobarian las imitaciones, no el codigo.
#
# **Esta exclusion esta declarada a proposito y se declara tambien en el
# informe academico.** Subir un numero escondiendo lo que lo baja seria
# justo lo contrario de lo que este proyecto defiende sobre los datos. Lo que
# se excluye se nombra uno por uno, para que cualquiera pueda comprobar que
# no se cuela nada que si atienda peticiones.
omit = [
    "app/__init__.py",
    "*/pruebas/*",
    # --- Carga de datos desde fuentes oficiales ---
    "app/utilidades/cargar_calendario.py",
    "app/utilidades/cargar_catalogo.py",
    "app/utilidades/cargar_fichas.py",
    "app/utilidades/cargar_prestadores.py",
    # --- Descarga y preparacion de datos geoespaciales ---
    "app/utilidades/descargar_dem.py",
    "app/utilidades/medir_cobertura_osm.py",
    "app/utilidades/preparar_red_vial.py",
    # --- Siembra de datos de demostracion ---
    "app/utilidades/proveedores_semilla.py",
    "app/utilidades/usuarios_semilla.py",
    # --- Verificacion manual de una fase ---
    "app/utilidades/verificar_fase4.py",
]

[tool.coverage.report]
# Umbral que convierte la meta del proyecto en una comprobacion real.
#
# La cobertura se MEDIA pero no se EXIGIA: pytest imprimia el porcentaje y
# devolvia exito aunque hubiera bajado al 20 %. La regla existia solo como
# texto en la documentacion, y una regla que ninguna herramienta comprueba es
# una regla que tarde o temprano se incumple sin que nadie se entere.
#
# Con fail_under, pytest termina con codigo de error si el total baja del
# umbral. Eso hace que la integracion continua se ponga en rojo sola, sin que
# nadie tenga que acordarse de mirar el numero.
#
# El valor es 95 porque 95 es lo que exige el curso. No es la marca actual
# -hoy es 96,28 %-, es el minimo comprometido: el margen de poco mas de un
# punto son unas cincuenta lineas de holgura para que un cambio normal no
# ponga la integracion en rojo por un decimal, y para que bajar del minimo
# tenga que ser un descuido de verdad y no un redondeo.
#
# Antes este valor era 60, el minimo de la Fase 2. Se sube ahora y no antes
# porque hasta ahora 95 habria dejado la rama roja de forma permanente, y un
# umbral que esta siempre en rojo se acaba ignorando igual que uno que nunca
# salta.
fail_under = 95

# Le indica a setuptools que el codigo del backend es el paquete "app"
# y todos sus subpaquetes (modelos, esquemas, rutas, servicios, ia...).
[tool.setuptools.packages.find]
include = ["app*"]
