<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo_rutavivamantaro.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Plataforma de turismo inteligente para la Ruta del Valle del Mantaro, Junin, Peru."
    />
    <title>RutaVivaMantaro</title>
    <script>
      // Aplica el tema guardado ANTES de que React se monte. Sin esto, la
      // pagina parpadearia en blanco durante un instante antes de volverse
      // oscura. Es el unico script en linea del proyecto y esta justificado.
      try {
        var temaGuardado = localStorage.getItem('rutaviva.tema');
        var prefiereOscuro = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (temaGuardado === 'oscuro' || (!temaGuardado && prefiereOscuro)) {
          document.documentElement.classList.add('oscuro');
        }
      } catch (e) {
        /* almacenamiento bloqueado: se usa el tema claro por defecto */
      }
    </script>
  </head>
  <body>
    <div id="raiz"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
