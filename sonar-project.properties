# Configuración de SonarQube para RutaVivaMantaro.
#
# ESTE ARCHIVO ESTÁ PREPARADO, NO EJECUTADO.
#
# Se deja listo para que el análisis se pueda lanzar sin tener que averiguar
# antes qué se analiza y qué no. Ejecutarlo exige un servidor de SonarQube y un
# token, que el proyecto no tiene: no se usan servicios de nube de pago.
#
# Para lanzarlo, con un SonarQube local en Docker:
#
#   docker run -d --name sonarqube -p 9000:9000 sonarqube:community
#   sonar-scanner -Dsonar.token=EL_TOKEN
#
# Antes hay que generar los informes de cobertura, porque el escáner los lee,
# no los calcula:
#
#   cd backend  && .venv/Scripts/python.exe -m pytest --cov-report=xml
#   cd frontend && npx vitest run --coverage

sonar.projectKey=rutavivamantaro
sonar.projectName=RutaVivaMantaro
sonar.projectVersion=0.7.0

# Qué se analiza. Se nombran los dos módulos por separado porque tienen
# lenguajes distintos y el escáner necesita saber dónde empieza cada uno.
sonar.sources=backend/app,frontend/src
sonar.tests=backend/pruebas,frontend/src/componentes/__pruebas__,frontend/src/paginas/__pruebas__

sonar.sourceEncoding=UTF-8

# Python
sonar.python.version=3.11,3.12,3.13,3.14
sonar.python.coverage.reportPaths=backend/coverage.xml

# TypeScript y React
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.typescript.tsconfigPath=frontend/tsconfig.app.json

# Qué se deja fuera del análisis, y por qué.
#
# - Los entornos y las dependencias no son código del proyecto.
# - Las migraciones de Alembic se generan solas; analizarlas produce avisos
#   sobre código que nadie escribió y que no se debe tocar a mano.
# - Los cuadernos son experimentación: su desorden es deliberado y no llega a
#   producción.
# - Los datos derivados (red vial, tiles de elevación) son binarios pesados.
sonar.exclusions=\
  **/.venv/**,\
  **/node_modules/**,\
  **/__pycache__/**,\
  **/dist/**,\
  backend/alembic/versions/**,\
  backend/notebooks/**,\
  backend/datos/**,\
  frontend/src/i18n/*.json

# Las pruebas se analizan, pero con otra vara: duplicar el montaje de un caso
# es normal en una prueba y no es deuda técnica.
sonar.cpd.exclusions=\
  backend/pruebas/**,\
  frontend/src/**/__pruebas__/**
