# Configuración de SonarQube para RutaVivaMantaro.
#
# EJECUTADO POR PRIMERA VEZ el 25 de septiembre de 2026, contra un SonarQube
# community 26.9.0 en Docker local (sin coste y sin nube, así que no incumple la
# prohibición de servicios de nube de pago).
#
# Antes de esa fecha este archivo estaba «preparado y no ejecutado», y al
# ejecutarlo se descubrió que NO funcionaba. El escáner abortaba con:
#
#   ERROR File frontend/src/componentes/__pruebas__/InterruptorTema.prueba.tsx
#   can't be indexed twice. Please check that inclusion/exclusion patterns
#   produce disjoint sets for main and test files
#
# La causa: las pruebas del frontend viven DENTRO de `frontend/src`, que es una
# fuente principal, así que `sonar.sources` y `sonar.tests` se solapaban. Se
# arregla excluyendo los directorios de prueba de las fuentes principales, para
# que los dos conjuntos sean disjuntos.
#
# Es la misma lección que la de las dos limitaciones falsas del catálogo: una
# configuración que nadie ha ejecutado no está «lista», está sin comprobar.
#
# Para lanzarlo, con un SonarQube local en Docker:
#
#   docker run -d --name sonarqube -p 9000:9000 sonarqube:community
#   docker run --rm -v "$(pwd):/usr/src" \
#     -e SONAR_HOST_URL=http://host.docker.internal:9000 \
#     -e SONAR_TOKEN=EL_TOKEN sonarsource/sonar-scanner-cli
#
# Antes hay que generar los informes de cobertura, porque el escáner los lee,
# no los calcula:
#
#   cd backend  && .venv/Scripts/python.exe -m pytest --cov-report=xml
#   cd frontend && npx vitest run --coverage --coverage.reporter=lcov
#
# El proveedor de cobertura del frontend hay que instalarlo, y fijado a la misma
# versión mayor que vitest o npm revienta al construir el árbol:
#
#   npm install --save-dev "@vitest/coverage-v8@^4.1.11"

sonar.projectKey=rutavivamantaro
sonar.projectName=RutaVivaMantaro
sonar.projectVersion=1.0.0

# Qué se analiza. Se nombran los dos módulos por separado porque tienen
# lenguajes distintos y el escáner necesita saber dónde empieza cada uno.
sonar.sources=backend/app,frontend/src

# Los cuatro directorios de prueba. Los tres del frontend están dentro de
# `sonar.sources`, así que además hay que excluirlos de las fuentes principales
# (ver sonar.exclusions). Si se añade un cuarto __pruebas__ en el frontend, hay
# que añadirlo en los dos sitios.
sonar.tests=backend/pruebas,frontend/src/componentes/__pruebas__,frontend/src/paginas/__pruebas__,frontend/src/utilidades/__pruebas__

sonar.sourceEncoding=UTF-8

# Python
sonar.python.version=3.11,3.12,3.13,3.14
sonar.python.coverage.reportPaths=backend/coverage.xml

# TypeScript y React
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.typescript.tsconfigPath=frontend/tsconfig.app.json

# Qué se deja fuera del análisis, y por qué.
#
# - Los entornos y las dependencias no son código del proyecto.
# - Las migraciones de Alembic se generan solas; analizarlas produce avisos
#   sobre código que nadie escribió y que no se debe tocar a mano.
# - Los cuadernos son experimentación: su desorden es deliberado y no llega a
#   producción.
# - Los datos derivados (red vial, teselas de elevación) son binarios pesados.
# - Los archivos de idioma son datos, no código.
# - Los directorios de prueba del frontend y su preparación común: van en
#   sonar.tests, y sin excluirlos de aquí el escáner aborta por indexarlos dos
#   veces.
sonar.exclusions=**/.venv/**,**/node_modules/**,**/__pycache__/**,**/dist/**,**/coverage/**,backend/alembic/versions/**,backend/notebooks/**,backend/datos/**,frontend/src/i18n/*.json,frontend/src/**/__pruebas__/**,frontend/src/configuracion_pruebas.ts

# Las pruebas se analizan, pero con otra vara: duplicar el montaje de un caso
# es normal en una prueba y no es deuda técnica.
sonar.cpd.exclusions=backend/pruebas/**,frontend/src/**/__pruebas__/**
